name: Publish website

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Keep CI compatible with the Hugo version used for local verification.
  HUGO_VERSION: "0.92.2"
  TZ: America/New_York

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        env:
          HUGO_ARCHIVE: hugo_extended_${{ env.HUGO_VERSION }}_Linux-64bit.tar.gz
        run: |
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_ARCHIVE}"
          tar --extract --gzip --file "${RUNNER_TEMP}/hugo.tar.gz" \
            --directory "${RUNNER_TEMP}" hugo
          "${RUNNER_TEMP}/hugo" version

      - name: Build website
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          "${RUNNER_TEMP}/hugo" --environment production --minify \
            --baseURL "${PAGES_BASE_URL}/" \
            --cacheDir "${RUNNER_TEMP}/hugo-cache"

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
