

[[paper]]
id = "exact-decision"
visible = true
subject = "tensor-methods"
title = "Structure and Exact Certification of Nonnegative Tensor Decompositions"
authors = "Haoming Wang and Ming Yuan"
venue = "Preprint"
year = 2026
research_year = 2026
url = "https://arxiv.org/abs/2610.32787"
figure = "images/papers/exact-decision.svg"
figure_alt = "Block diagram of the known and unknown blocks of A and B and the rows used to recover them"
summary = '''
Beyond sufficient criteria [[2]](#paper-tensor-identifiability), we study decomposition structure and exactly determine nonnegative rank, minimality, and essential uniqueness. For rational input with \(R\) terms and \(L\) bits, this takes \(G(R)L^{O(R^2)}\) time, with an exponent independent of tensor order and dimensions.
'''


[[paper]]
id = "tensor-identifiability"
visible = true
subject = "tensor-methods"
title = "Identifiability of Nonnegative Tensor Decompositions via Positive Scattering"
authors = "Haoming Wang and Ming Yuan"
venue = "Preprint"
year = 2026
research_year = 2026
url = "https://arxiv.org/abs/2609.11606"
figure = "images/papers/tensor-identifiability.svg"
figure_alt = "Lattice diagrams of boxes B1 and B2, joined by a rook step in (a) and split into components K1 and K2 in (b)"
summary = '''
Kruskal's theorem gives uniqueness of a tensor decomposition from the ranks of its factors. For nonnegative tensors, positivity carries further information. We formalize this as positive scattering and show that it yields identifiability where rank conditions alone fail.
'''


