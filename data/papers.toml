url = "https://arxiv.org/abs/2609.15076"
figure = "images/papers/udd-svd.png"
figure_alt = "Excerpt from the paper stating Theorems 3.1 and 3.2"
summary = '''
The SVD is well understood for matrices and compact operators, yet many operators that arise in practice are unbounded. We develop three forms of the SVD for unbounded operators and illustrate their applications in engineering, computation, statistics, and finance.
'''


